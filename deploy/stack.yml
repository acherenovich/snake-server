services:
  snake-server:
    image: ${REGISTRY_IMAGE_PREFIX:-ghcr.io/acherenovich}/snake-server:${IMAGE_TAG:-latest}
    environment:
      MYSQL_HOST: ${MYSQL_HOST:?MYSQL_HOST is required}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      MYSQL_USER: ${MYSQL_USER:?MYSQL_USER is required}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      MYSQL_DATABASE: ${MYSQL_DATABASE:?MYSQL_DATABASE is required}
      MYSQL_THREADS: ${MYSQL_THREADS:-1}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required}
      INTERNAL_WS_PORT: 9101
    ports:
      - target: 9100
        published: 9100
        protocol: tcp
        mode: ingress
    deploy:
      replicas: 1
      restart_policy:
        condition: any
    networks:
      - snake

  snake-game-server-1:
    image: ${REGISTRY_IMAGE_PREFIX:-ghcr.io/acherenovich}/snake-game-server:${GAME_IMAGE_TAG:-latest}
    environment:
      SNAKE_SERVER_HOST: snake-server
      SNAKE_SERVER_INTERNAL_PORT: 9101
      UDP_HOST: ${SNAKE_PUBLIC_HOST:?SNAKE_PUBLIC_HOST is required}
      UDP_BASE_PORT: 7778
    ports:
      - target: 7778
        published: 7778
        protocol: udp
        mode: ingress
      - target: 7779
        published: 7779
        protocol: udp
        mode: ingress
      - target: 7780
